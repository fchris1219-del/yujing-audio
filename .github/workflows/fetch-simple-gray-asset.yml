name: Fetch simple-gray assistant asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch artwork
        run: |
          mkdir -p images/simple-gray
          curl --fail --location --retry 5 --retry-all-errors \
            'https://i.postimg.cc/5N1tRWV5/%281%29.jpg' \
            --output images/simple-gray/assistant-artwork.jpg
          file images/simple-gray/assistant-artwork.jpg
      - name: Commit artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/simple-gray/assistant-artwork.jpg
          git diff --cached --quiet || git commit -m 'Add simple-gray assistant artwork'
          git push
